spring.application.name=ragexample


#DataBase
spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=tinyllama
spring.ai.ollama.embedding.options.model=all-minilm

# Chroma config (custom)
chroma.tenant-name=default
chroma.database-name=default
chroma.collection-name=documents


# Chroma connection
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000

logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=ERROR
spring.ai.vectorstore.chroma.enabled=false
spring.docker.compose.enabled=false